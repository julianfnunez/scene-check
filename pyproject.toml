[project]
name = "scene-watch"
version = "0.1.0"
description = "Plain-language camera scenes evaluated with an MCP-equipped agent"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "mcp>=1.12,<2", "httpx>=0.28,<1", "python-dotenv>=1,<2", "PyYAML>=6,<7", "jsonschema>=4.20,<5"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
