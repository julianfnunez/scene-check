services:
  scene-watch:
    build: .
    init: true
    ports: ["8081:8081"]
    env_file: .env
    volumes:
      - ./data:/data
      - ./scenes.yaml:/app/scenes.yaml:ro
      - ./sensors.yaml:/app/sensors.yaml:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
