schedules:
  nightly_coop_check:
    target: active_scenes
    time: "21:15"
    timezone: America/New_York
    enabled: true
    catch_up_minutes: 60

run:
  on:
    failure: [notify_failure]
    not_normal:
      instructions: >
        Turn Hue red, then send me one phone notification describing the complete run
        in plain English. List problems and uncertainties first, then what was confirmed.
        Keep it brief but informative.
      actions: [red_light, notify_me]
    normal:
      instructions: >
        Send me one brief phone notification confirming the findings across all
        scenes in this run, without repeating individual scene names unnecessarily.
      actions: [notify_me]

scenes:
  girls:
    name: Girls
    active: true
    sensors:
      coop_camera:
        instructions: Take 4 captures, 10 seconds apart. Evaluate each capture independently.
      girls_door:
        evaluations: 1
    conditions:
      - Three chickens are visible inside the coop.
      - The coop door is closed.
  chicky:
    name: Chicky
    active: true
    sensors:
      camera_2:
        instructions: Take 4 captures, 10 seconds apart. Evaluate each capture independently.
    conditions:
      - One chicken is visible inside the coop.
      - The coop door is closed.
